services:
  fuseki:
    build:
      context: ./fuseki
      args:
        JENA_VERSION: "6.2.0"
    image: explore-jena-sparql/fuseki:6.2.0
    container_name: fuseki
    ports:
      - "3030:3030"
    environment:
      JAVA_OPTIONS: "-Xmx2g"
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-admin}
    volumes:
      - fuseki-data:/fuseki/databases
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3030/$$/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  fuseki-data:
