# Fuseki security: admin endpoints (/$/**) require HTTP basic auth as "admin".
# ADMIN_PASSWORD is substituted from the environment by entrypoint.sh at startup.

[main]
ssl.enabled = false
plainMatcher = org.apache.shiro.authc.credential.SimpleCredentialsMatcher
iniRealm.credentialsMatcher = $plainMatcher

[users]
admin = ${ADMIN_PASSWORD}, administrator

[roles]
administrator = *

[urls]
## Open to anyone
/$/server  = anon
/$/ping    = anon
/$/metrics = anon

## Admin UI and API: basic auth
/$/** = authcBasic, roles[administrator]

## Dataset endpoints (/ds/*) and the UI pages
/** = anon
